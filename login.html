<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CupcakeStore - Login de Acesso</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>

    <header>
        <div>
            <img src="img/cupcakestore-logo.svg" alt="cupcakestore-logo.svg" width="128px">   
        </div>
        <h1 id="frase">"Delícias em miniatura que conquistam corações"</h1>
        <!-- Navegação Global -->
        <nav id="menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sabores.html">Nossos Sabores</a></li>
                <li><a href="login.html">Login/Cadastro</a></li>
            </ul>
        </nav>
    
    </header>

    <hr>

    <main>
        <h1>Login de Acesso</h1>

        <form action="" method="post">
            <div>
                <label for="email">E-mail</label>
                <input type="email" id="email" name = "email" required>
            </div>
            <div>
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <div>
                <button type="submit">Enviar</button>
            </div>
        </form>

        <p>Ainda não possui cadastro?</p>
        <p><a href="cadastro.html">Cadastre-se aqui!</a></p>
    </main>

    <hr>

    <footer>
        <p>&copy; 2025 CupcakeStore - Todos os direitos reservados</p>
        <p>Siga-nos nas redes sociais: @cupcakestore</p>
        <p>Desenvolvido com ❤️ e muito açucar</p>
    </footer>
</body>
</html>
